[package]
name = "agent-wrangler-desktop"
version = "0.1.0"
description = "Thin desktop window for Agent Wrangler"
edition = "2021"
license = "Apache-2.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
serde_json = "1"
tungstenite = "0.29"

[profile.release]
opt-level = "s"
lto = true
strip = true
